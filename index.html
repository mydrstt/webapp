<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>학교 생활 기록실 — 급식 · 시간표 · 학사일정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef4ff;
  --ink:#182235;
  --muted:#77839a;
  --muted2:#96a1b2;
  --glass:rgba(255,255,255,.58);
  --glass-strong:rgba(255,255,255,.82);
  --line:rgba(255,255,255,.82);
  --blue:#4b86ff;
  --blue2:#73b8ff;
  --violet:#9277ff;
  --pink:#f48dc5;
  --cyan:#65d4ff;
  --green:#6ed1ab;
  --yellow:#ffd77b;
  --shadow:0 26px 70px rgba(75,104,158,.16);
  --soft-shadow:0 10px 28px rgba(74,96,145,.10);
  --radius:28px;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Pretendard",system-ui,sans-serif;
  color:var(--ink);background:#eef4ff;letter-spacing:-.025em;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
::selection{background:rgba(75,134,255,.18)}
.hidden{display:none!important}

.app-bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:linear-gradient(145deg,#fafcff 0%,#eef5ff 42%,#f8f0ff 100%)}
.orb{position:absolute;border-radius:999px;filter:blur(2px);opacity:.72;animation:float 12s ease-in-out infinite}
.orb.a{width:420px;height:420px;left:-120px;top:-160px;background:radial-gradient(circle at 35% 35%,#b7e8ff,rgba(120,178,255,.22) 55%,transparent 72%)}
.orb.b{width:480px;height:480px;right:-170px;top:60px;background:radial-gradient(circle at 40% 40%,#e7c7ff,rgba(191,151,255,.18) 58%,transparent 74%);animation-delay:-4s}
.orb.c{width:390px;height:390px;left:34%;bottom:-190px;background:radial-gradient(circle at 45% 35%,#ffe0a6,rgba(255,205,121,.14) 60%,transparent 74%);animation-delay:-7s}
.noise{position:absolute;inset:0;opacity:.022;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E")}
.pointer-glow{position:fixed;z-index:2;width:260px;height:260px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(125,180,255,.16),transparent 68%);transform:translate(-50%,-50%);mix-blend-mode:multiply;transition:left .12s ease-out,top .12s ease-out}

.glass{background:linear-gradient(145deg,rgba(255,255,255,.68),rgba(255,255,255,.42));border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.85);backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%)}

/* App shell */
.app-shell{position:relative;z-index:4;width:min(1240px,calc(100% - 30px));height:100dvh;margin:0 auto;display:flex;flex-direction:column;padding:14px 0 14px}
.topbar{height:62px;flex:0 0 auto;border-radius:22px;background:rgba(255,255,255,.53);border:1px solid rgba(255,255,255,.84);box-shadow:0 12px 42px rgba(69,91,139,.12),inset 0 1px rgba(255,255,255,.9);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%)}
.topbar-inner{height:100%;padding:0 10px 0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}.brand-mark{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:white;font-size:18px;background:linear-gradient(145deg,#77baff,#6b83ff 55%,#a779ff);box-shadow:0 7px 18px rgba(93,137,244,.28),inset 0 1px rgba(255,255,255,.55)}
.brand-title{font-size:15px;font-weight:850;line-height:1}.brand-sub{font-size:10px;color:#8792a5;margin-top:5px;white-space:nowrap}
.top-actions{display:flex;gap:7px}.icon-btn,.small-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid rgba(255,255,255,.82);background:rgba(255,255,255,.54);color:#516079;border-radius:14px;box-shadow:0 5px 16px rgba(67,88,130,.08),inset 0 1px rgba(255,255,255,.9);transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,background .22s}.icon-btn{width:40px;height:40px}.small-btn{padding:10px 13px;font-size:11px;font-weight:800}.icon-btn:hover,.small-btn:hover{transform:translateY(-2px) scale(1.015);background:rgba(255,255,255,.82);box-shadow:0 10px 24px rgba(67,88,130,.13),inset 0 1px white}.icon-btn:active,.small-btn:active{transform:scale(.96)}

.ai-bar-wrap{flex:0 0 auto;padding:12px 0 10px;display:flex;justify-content:center}
.ai-top-button{width:min(960px,100%);min-height:72px;padding:0 22px;border-radius:23px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#28334a;background:linear-gradient(135deg,rgba(255,255,255,.82),rgba(246,238,255,.62));border:1px solid rgba(255,255,255,.88);box-shadow:0 12px 30px rgba(98,84,170,.09),inset 0 1px white;backdrop-filter:blur(24px) saturate(155%);-webkit-backdrop-filter:blur(24px) saturate(155%);transition:transform .22s,box-shadow .22s}
.ai-top-button:hover{transform:translateY(-2px);box-shadow:0 18px 34px rgba(98,84,170,.13),inset 0 1px white}
.ai-top-left{display:flex;align-items:center;gap:10px;min-width:0}.ai-top-mark{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:white;background:linear-gradient(145deg,#76b8ff,#7582ff 58%,#9d7aff);box-shadow:0 8px 18px rgba(92,117,236,.2);flex:0 0 auto}.ai-top-copy{text-align:left;min-width:0}.ai-top-label{font-size:14px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ai-top-sub{font-size:10px;color:#8f99aa;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ai-top-arrow{font-size:20px;color:#7884a0;flex:0 0 auto}

/* Main content is a custom app scroll view */
.content{min-height:0;flex:1 1 auto;position:relative}
.main-scroll{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;padding:2px 4px calc(118px + env(safe-area-inset-bottom));scroll-behavior:smooth;overscroll-behavior:contain}
.main-scroll::-webkit-scrollbar{display:none;width:0;height:0}

.school-strip{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:4px 4px 2px;min-height:70px}.school-meta{display:flex;align-items:center;gap:12px;min-width:0}.school-symbol{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.64);border:1px solid white;box-shadow:var(--soft-shadow);color:#6b8dff;font-size:18px;flex:0 0 auto}.eyebrow{font-size:9px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:#8793a9}.school-name{font-size:26px;font-weight:900;letter-spacing:-.055em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.school-detail{font-size:11px;color:#8994a7;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.header-actions{display:flex;gap:7px;flex-shrink:0}

.tab-panel{display:none;animation:panelIn .35s ease}.tab-panel.active{display:block}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 2px 14px}.section-title{font-size:21px;font-weight:900;letter-spacing:-.05em}.section-sub{font-size:10px;color:#8a95a8;margin-top:5px}.section-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}

/* Meal */
.meal-layout{display:grid;grid-template-columns:minmax(0,1.48fr) minmax(290px,.82fr);gap:16px;align-items:stretch}.meal-hero,.meal-ai,.glass-card{position:relative;border-radius:28px;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.76),rgba(255,255,255,.46));border:1px solid rgba(255,255,255,.88);box-shadow:var(--shadow),inset 0 1px white;backdrop-filter:blur(25px) saturate(150%);-webkit-backdrop-filter:blur(25px) saturate(150%)}
.meal-hero{padding:31px 31px 29px;min-height:340px}.meal-hero:before{content:"";position:absolute;width:320px;height:320px;right:-140px;top:-140px;border-radius:50%;background:radial-gradient(circle,#bde4ff,transparent 68%);opacity:.68;pointer-events:none}.date-row{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.date-big{font-size:31px;font-weight:900;letter-spacing:-.06em}.date-small{font-size:12px;color:#8290a5;margin-top:7px}.today-tag{padding:8px 11px;border-radius:999px;background:rgba(89,145,255,.1);color:#4f7fe7;font-size:9px;font-weight:900;letter-spacing:.1em;flex:0 0 auto}.menu-heading{font-size:9px;letter-spacing:.12em;color:#9aa5b7;font-weight:850;margin-top:32px;margin-bottom:12px}.menu-list{display:flex;flex-wrap:wrap;gap:8px;max-width:78%;min-height:92px;align-content:flex-start}.menu-chip{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 12px rgba(68,92,137,.07);font-size:11px;color:#43516a;line-height:1.25;white-space:nowrap}.meal-foot{position:absolute;left:31px;right:31px;bottom:28px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.meal-note{font-size:10px;color:#9aa4b6;line-height:1.5;max-width:58%}.calorie{text-align:right}.calorie-label{font-size:9px;color:#96a0b1}.calorie-value{font-size:25px;font-weight:900;color:#456fe0;margin-top:3px;letter-spacing:-.04em}
.meal-ai{padding:28px 27px 25px;min-height:340px;background:linear-gradient(145deg,rgba(245,250,255,.82),rgba(235,229,255,.56));display:flex;flex-direction:column;justify-content:space-between}.meal-ai:after{content:"✦";position:absolute;right:14px;top:4px;font-size:96px;line-height:1;color:rgba(133,117,255,.08);transform:rotate(15deg);pointer-events:none}.ai-label{font-size:9px;letter-spacing:.12em;font-weight:900;color:#8b80d6}.ai-title{font-size:20px;font-weight:900;margin-top:7px}.ai-copy{font-size:13px;line-height:1.75;color:#69758d;margin-top:28px;white-space:pre-line}.ai-footer{display:flex;align-items:center;justify-content:space-between;gap:10px}.ai-footer-note{font-size:9px;color:#98a2b2}.ai-button{border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.88);color:#63708a;font-size:10px;font-weight:850;box-shadow:inset 0 1px white}
.week-section{margin-top:24px}.week-shell{padding:12px;border-radius:26px;background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.72);box-shadow:var(--soft-shadow);backdrop-filter:blur(22px) saturate(145%);-webkit-backdrop-filter:blur(22px) saturate(145%)}.week-scroller{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:2px}.week-scroller::-webkit-scrollbar{display:none}.week-day{scroll-snap-align:start;flex:0 0 160px;min-height:122px;padding:15px 14px;border-radius:20px;text-align:left;background:rgba(255,255,255,.53);border:1px solid rgba(255,255,255,.74);color:#536178;box-shadow:inset 0 1px white;transition:transform .22s,background .22s,box-shadow .22s}.week-day:hover{transform:translateY(-2px)}.week-day.active{background:linear-gradient(145deg,rgba(231,244,255,.9),rgba(255,255,255,.64));box-shadow:0 14px 28px rgba(77,124,208,.1),inset 0 1px white;transform:translateY(-2px)}.day-top{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}.day-name{font-size:9px;color:#8c98ab}.day-num{font-size:24px;font-weight:900;color:#30405d}.day-meal{font-size:10px;line-height:1.55;margin-top:16px;height:35px;overflow:hidden;color:#66738a}.day-cal{font-size:8px;color:#9ba5b4;margin-top:12px}

/* Timetable */
.timetable-toolbar,.schedule-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}.day-picker{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px}.day-picker::-webkit-scrollbar{display:none}.day-pill{min-width:62px;padding:9px 10px;border-radius:15px;background:rgba(255,255,255,.48);border:1px solid rgba(255,255,255,.78);color:#67738b;box-shadow:inset 0 1px white;transition:.2s}.day-pill:hover{transform:translateY(-1px)}.day-pill.active{background:linear-gradient(145deg,rgba(228,242,255,.9),rgba(255,255,255,.72));color:#4777d8;box-shadow:0 10px 20px rgba(67,124,212,.09),inset 0 1px white}.day-pill .w{font-size:8px;color:#8b97aa}.day-pill .d{font-size:18px;font-weight:900;margin-top:3px}.filter-pair{display:flex;gap:7px;align-items:center}.select-pill{appearance:none;border:1px solid rgba(255,255,255,.88);background:rgba(255,255,255,.62);border-radius:13px;padding:9px 12px;color:#5c6a82;font-size:10px;outline:none;box-shadow:inset 0 1px white}.timetable-card{padding:23px;border-radius:28px}.timetable-meta{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}.timetable-date{font-size:25px;font-weight:900;letter-spacing:-.055em}.timetable-sub{font-size:10px;color:#8b96a9;margin-top:5px}.timetable-wrap{overflow:hidden;border-radius:22px;background:rgba(255,255,255,.32);border:1px solid rgba(255,255,255,.68);padding:8px;box-shadow:inset 0 1px white}.timetable{width:100%;border-collapse:separate;border-spacing:7px;table-layout:fixed}.timetable th,.timetable td{border-radius:15px;text-align:center;background:rgba(255,255,255,.47);font-size:9px;color:#65728a;padding:8px 6px;min-height:52px}.timetable th{background:rgba(227,237,255,.68);font-weight:900}.timetable td{height:64px;vertical-align:middle}.timetable .period-cell{width:64px;background:rgba(255,255,255,.28);color:#949fb0;font-size:9px}.subject{font-size:11px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subject-room{font-size:8px;color:#9ca6b6;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.single-day-table{width:100%;border-collapse:separate;border-spacing:0 8px}.single-day-table tr{background:rgba(255,255,255,.43)}.single-day-table td{padding:15px 14px}.single-day-table td:first-child{width:78px;border-radius:16px 0 0 16px;color:#97a1b1;font-size:10px}.single-day-table td:last-child{border-radius:0 16px 16px 0}.single-subject{font-size:15px;font-weight:850}.single-room{font-size:9px;color:#9ba5b4;margin-top:4px}

/* Schedule */
.month-chip{display:flex;align-items:center;gap:6px}.month-label{min-width:92px;text-align:center;font-size:12px;font-weight:850;color:#526079}.schedule-card{padding:22px 22px 20px;border-radius:28px}.schedule-list{display:grid;gap:9px}.event{display:grid;grid-template-columns:60px minmax(0,1fr);gap:13px;align-items:center;padding:13px 12px;border-radius:17px;background:rgba(255,255,255,.43);border:1px solid rgba(255,255,255,.62);min-height:64px}.event-date{font-size:10px;color:#8d98a9;font-weight:800;line-height:1.35}.event-date.today-event{color:#477fe9}.event-title{font-size:12px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-desc{font-size:9px;color:#98a2b2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.schedule-empty{padding:42px 12px;text-align:center;color:#98a2b2;font-size:11px}.schedule-more{margin-top:12px;width:100%;height:40px;border-radius:14px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8);color:#69758b;font-size:10px;font-weight:850}

/* Bottom tabs */
.tabbar-zone{position:absolute;z-index:30;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 0 calc(4px + env(safe-area-inset-bottom));pointer-events:none}.tabbar{width:min(760px,calc(100% - 8px));height:72px;border-radius:25px;background:rgba(255,255,255,.64);border:1px solid rgba(255,255,255,.86);box-shadow:0 18px 45px rgba(74,96,145,.15),inset 0 1px white;backdrop-filter:blur(30px) saturate(175%);-webkit-backdrop-filter:blur(30px) saturate(175%);display:grid;grid-template-columns:repeat(3,1fr);padding:6px;pointer-events:auto}
.tab{position:relative;border-radius:19px;background:transparent;color:#66738b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:9px;font-weight:750;transition:.22s}.tab .tab-icon{font-size:18px;line-height:1}.tab .tab-label{font-size:9px}.tab.active{background:linear-gradient(145deg,rgba(235,246,255,.96),rgba(246,239,255,.83));color:#4a6fd7;box-shadow:0 9px 20px rgba(78,110,184,.1),inset 0 1px white}.tab::after{content:"";position:absolute;bottom:4px;left:50%;width:22px;height:3px;border-radius:999px;background:linear-gradient(90deg,#70b9ff,#957eff);opacity:0;transform:translateX(-50%) scale(.7);transition:.2s}.tab.active::after{opacity:1;transform:translateX(-50%) scale(1)}

/* Setup */
.setup-container-shell{height:100%;min-height:0;overflow:auto;scrollbar-width:none;-ms-overflow-style:none}.setup-container-shell::-webkit-scrollbar{display:none;width:0;height:0}
.setup-shell{min-height:100%;height:auto;display:flex;align-items:flex-start;justify-content:center;padding:28px 4px 44px}.setup-card{width:min(700px,100%);margin:0 auto;padding:0;border-radius:32px;overflow:hidden}.setup-top{padding:32px 32px 28px;background:linear-gradient(145deg,rgba(255,255,255,.77),rgba(241,246,255,.55));border-bottom:1px solid rgba(255,255,255,.7)}.setup-kicker{font-size:9px;font-weight:900;letter-spacing:.14em;color:#8c96a9}.setup-title{font-size:34px;font-weight:900;letter-spacing:-.065em;margin-top:8px}.setup-copy{font-size:12px;color:#8995a8;line-height:1.6;margin-top:10px;max-width:560px}.setup-body{padding:28px 32px 32px;background:rgba(255,255,255,.28)}.stepper{display:flex;align-items:center;gap:8px;margin-bottom:24px}.step-dot{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.7);color:#98a1af;font-size:9px;font-weight:900}.step-dot.active{background:linear-gradient(145deg,#7dbbff,#7682ff);color:white;box-shadow:0 7px 16px rgba(92,124,232,.18)}.step-line{height:1px;flex:1;background:rgba(255,255,255,.72)}.setup-step-title{font-size:21px;font-weight:900}.setup-step-sub{font-size:10px;color:#8f9aab;margin-top:6px}.field{margin-top:20px}.field-label{display:block;font-size:10px;font-weight:850;color:#66738a;margin-bottom:8px}.picker,.input,.class-select{width:100%;height:49px;border-radius:16px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.58);color:#56647c;padding:0 14px;outline:none;box-shadow:inset 0 1px white}.picker{display:flex;align-items:center;justify-content:space-between}.input::placeholder{color:#a0a8b5}.school-results{margin-top:9px;max-height:210px;overflow:auto;scrollbar-width:none}.school-results::-webkit-scrollbar{display:none}.school-item{width:100%;text-align:left;padding:12px 13px;border-radius:14px;background:rgba(255,255,255,.47);border:1px solid rgba(255,255,255,.6);margin-bottom:6px;color:#58657d}.school-item strong{font-size:11px;display:block}.school-item small{font-size:8px;color:#98a2b2;display:block;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grade-class-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary,.secondary{height:49px;border-radius:16px;font-weight:850;font-size:11px}.primary{background:linear-gradient(145deg,#70b7ff,#7782ff 58%,#a27fff);color:white;box-shadow:0 12px 22px rgba(95,122,228,.22),inset 0 1px rgba(255,255,255,.38)}.secondary{background:rgba(255,255,255,.56);color:#67748a;border:1px solid rgba(255,255,255,.78)}.primary:disabled{opacity:.42;cursor:not-allowed}.setup-actions{display:grid;grid-template-columns:120px 1fr;gap:9px;margin-top:24px}

/* Modals */

<script>
/* ======================== CONFIG ======================== */
// API 키는 소스에 평문으로 두지 않고, 페이지 로드 후 Web Crypto로 복호화한다.
// (브라우저에서 실행되는 HTML인 만큼 '보안 저장소'가 아니라 소스 노출을 줄이는 목적의 암호화/난독화다.)
const ENCRYPTED_API_BUNDLE={
  salt:'rk7bsG3DCEMiYM+O82nZww==',
  iv:'AvuWAaDUrW5Vb7fv',
  data:'ouAEFNlMVHFX4RYnmAon6v2GMdKT5ji97Yz4FdrlscmRxoE8qqK9E5zC7VTw0mF4f3JE5k70gGmf8AYnBA6+E93StW4BcPhMnL+Gj+agV1cw/ViVgVhcuwGhoB3837iUfGmcu5IzaPMv18zfX9erPG+7JsnrAM0cIRBdUQ==',
  iterations:120000,
  passphrase:['LQG-iOS-','2026-sch','ool-arch','ive-seed-9f3c'].join('')
};
let API_KEYS=null;
const NEIS_BASE='https://open.neis.go.kr/hub';
function b64ToBytes(v){const bin=atob(v);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
async function getApiKeys(){
  if(API_KEYS)return API_KEYS;
  try{
    const pass=new TextEncoder().encode(ENCRYPTED_API_BUNDLE.passphrase);
    const material=await crypto.subtle.importKey('raw',pass,'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64ToBytes(ENCRYPTED_API_BUNDLE.salt),iterations:ENCRYPTED_API_BUNDLE.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(ENCRYPTED_API_BUNDLE.iv)},key,b64ToBytes(ENCRYPTED_API_BUNDLE.data));
    API_KEYS=JSON.parse(new TextDecoder().decode(plain));
    return API_KEYS;
  }catch(err){
    console.error('API 키 복호화 실패',err);
    throw new Error('API 설정을 불러오지 못했습니다.');
  }
}
const offices=[
 {name:'서울특별시교육청',code:'B10'},{name:'부산광역시교육청',code:'C10'},{name:'대구광역시교육청',code:'D10'},
 {name:'인천광역시교육청',code:'E10'},{name:'광주광역시교육청',code:'F10'},{name:'대전광역시교육청',code:'G10'},
 {name:'울산광역시교육청',code:'H10'},{name:'세종특별자치시교육청',code:'I10'},{name:'경기도교육청',code:'J10'},
 {name:'강원특별자치도교육청',code:'K10'},{name:'충청북도교육청',code:'M10'},{name:'충청남도교육청',code:'N10'},
 {name:'전북특별자치도교육청',code:'P10'},{name:'전라남도교육청',code:'Q10'},{name:'경상북도교육청',code:'R10'},
 {name:'경상남도교육청',code:'S10'},{name:'제주특별자치도교육청',code:'T10'}
];
const state={
 officeCode:'',officeName:'',schoolCode:'',schoolName:'',schoolKind:'',schoolData:null,grade:'',className:'',
 mealRows:[],scheduleRows:[],scheduleMonth:new Date(),selectedMealDate:todayDate(),selectedTimetableDate:todayDate(),
 timetableCache:{},currentTab:'meal',currentView:'direct',todayMenuText:'',todayCalInfo:'',aiLastReport:'',aiChatHistory:[],aiBusy:false,setupStep:1,aiLastError:'',aiQuickInsightCache:{},aiQuickInsightKey:'',aiQuickInsightPending:null
};
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`}
function fromYmd(v){return new Date(Number(v.slice(0,4)),Number(v.slice(4,6))-1,Number(v.slice(6,8)))}

function fmtLong(d){return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`}

function shortDate(d){return `${d.getMonth()+1}/${d.getDate()}`}
function isSameDay(a,b){return ymd(a)===ymd(b)}

/* ======================== NEIS ======================== */
async function neis(endpoint,params={}){
  const keys=await getApiKeys();
  const qs=new URLSearchParams({KEY:keys.neis,Type:'json',pIndex:'1',pSize:'1000',...params});
  const r=await fetch(`${NEIS_BASE}/${endpoint}?${qs.toString()}`);if(!r.ok)throw new Error(`NEIS HTTP ${r.status}`);
  const data=await r.json();if(data.RESULT?.CODE&&data.RESULT.CODE!=='INFO-000')throw new Error(data.RESULT.MESSAGE||data.RESULT.CODE);return data;
}
function extractRows(data,dataset){const block=data?.[dataset];if(!block)return [];if(Array.isArray(block)&&block[1]?.row)return block[1].row;return block.row||[]}

/* ======================== INIT ======================== */
window.addEventListener('DOMContentLoaded',init);
async function init(){
  initOfficeList();
  $('ai-chat-input')?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendAiChat()}});
  window.addEventListener('mousemove',e=>{const g=$('pointer-glow');g.style.left=e.clientX+'px';g.style.top=e.clientY+'px'});
  const saved={officeCode:localStorage.getItem('neis_office_code')||'',officeName:localStorage.getItem('neis_office_name')||'',schoolCode:localStorage.getItem('neis_school_code')||'',schoolName:localStorage.getItem('neis_school_name')||'',schoolKind:localStorage.getItem('neis_school_kind')||'',grade:localStorage.getItem('neis_grade')||'',className:localStorage.getItem('neis_class')||''};
  Object.assign(state,saved);
  if(saved.officeCode&&saved.schoolCode&&saved.grade&&saved.className){state.schoolData={SCHUL_KND_SC_NM:state.schoolKind};await bootDashboard();}
  else {showSetup(getSetupStep());}
  document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement?.tagName))return;const s=$('main-scroll');if(!s)return;if(e.key==='PageDown'){e.preventDefault();s.scrollBy({top:Math.max(360,s.clientHeight*.82),behavior:'smooth'})}if(e.key==='PageUp'){e.preventDefault();s.scrollBy({top:-Math.max(360,s.clientHeight*.82),behavior:'smooth'})}});
}
function initOfficeList(){
  const c=$('office-list-container');c.innerHTML='';
  offices.forEach(o=>{const b=document.createElement('button');b.className='office-option';b.innerHTML=`<strong>${esc(o.name)}</strong><span style="display:block;margin-top:3px;font-size:9px;color:#98a2b2">${o.code}</span>`;b.onclick=()=>{state.officeCode=o.code;state.officeName=o.name;closeOfficePicker();renderSetup();};c.appendChild(b)});
}

/* ======================== SETUP WIZARD ======================== */
function getSetupStep(){
  if(!state.officeCode)return 1;
  if(!state.schoolCode)return 2;
  if(!state.grade||!state.className)return 3;
  return 3;
}
function showSetup(step=getSetupStep()){
  state.setupStep=Math.max(1,Math.min(3,step));
  $('dashboard-container').classList.add('hidden');$('setup-container').classList.remove('hidden');renderSetup();
}
function renderSetup(){
  const el=$('setup-container');const step=state.setupStep||getSetupStep();
  const stepTitle=['','교육청은 어디야?','어느 학교에 다녀?','몇 학년 몇 반이야?'][step];
  const stepCopy=['','지역 교육청을 선택하면 학교 검색을 시작할 수 있어요.','학교 이름을 검색하고 정확한 학교를 하나 골라주세요.','이 정보는 시간표를 불러오는 데 사용돼요.'][step];
  const gradeOpts=gradeOptions().map(g=>`<option value="${g}" ${String(state.grade)===String(g)?'selected':''}>${g}학년</option>`).join('');
  const classOpts=Array.from({length:40},(_,i)=>i+1).map(g=>`<option value="${g}" ${String(state.className)===String(g)?'selected':''}>${g}반</option>`).join('');
  const dots=[1,2,3].map(i=>`<div class="step-dot ${i<=step?'active':''}">${i}</div>${i<3?'<div class="step-line"></div>':''}`).join('');
  let body='';
  if(step===1){
    body=`
      <div class="setup-question">${esc(stepTitle)}</div>
      <div class="setup-step-sub">${esc(stepCopy)}</div>
      <div class="office-options">${offices.map(o=>`<button class="office-option ${state.officeCode===o.code?'selected':''}" onclick="chooseOffice('${o.code}','${esc(o.name).replace(/'/g,'&#39;')}')"><span><strong>${esc(o.name)}</strong><small>${o.code}</small></span><b>${state.officeCode===o.code?'✓':'›'}</b></button>`).join('')}</div>
      <div class="setup-actions single"><button id="office-next" class="primary" ${state.officeCode?'':'disabled'} onclick="nextSetupStep()">다음</button></div>`;
  } else if(step===2){
    body=`
      <div class="setup-picked glass"><span class="setup-picked-label">선택한 교육청</span><strong>${esc(state.officeName)}</strong><button class="small-btn" onclick="showSetup(1)">바꾸기</button></div>
      <div class="setup-question">${esc(stepTitle)}</div>
      <div class="setup-step-sub">${esc(stepCopy)}</div>
      <div class="field setup-focus-field"><label class="field-label">학교 이름</label><input id="school-input" class="input big-input" autocomplete="off" value="${esc(state.schoolName||'')}" placeholder="학교 이름을 입력하세요"><div id="school-results" class="school-results hidden"></div></div>
      <div class="setup-actions"><button class="secondary" onclick="showSetup(1)">이전</button><button id="school-next" class="primary" ${state.schoolCode?'':'disabled'} onclick="nextSetupStep()">다음</button></div>`;
  } else {
    body=`
      <div class="setup-picked glass"><span class="setup-picked-label">선택한 학교</span><strong>${esc(state.schoolName)}</strong><small>${esc(state.officeName)} · ${esc(state.schoolKind||'학교')}</small><button class="small-btn" onclick="showSetup(2)">바꾸기</button></div>
      <div class="setup-question">${esc(stepTitle)}</div>
      <div class="setup-step-sub">${esc(stepCopy)}</div>
      <div class="field setup-focus-field"><label class="field-label">학급</label><button type="button" class="class-picker-trigger" onclick="openClassPicker()"><span><span class="class-picker-kicker">MY CLASS</span><span class="class-picker-value">${state.grade&&state.className?`${esc(state.grade)}학년 ${esc(state.className)}반`:'학년과 반을 선택하세요'}</span><span class="class-picker-sub">선택하면 시간표 조회에 사용됩니다.</span></span><span class="class-picker-arrow">›</span></button></div>
      <div class="setup-actions"><button class="secondary" onclick="showSetup(2)">이전</button><button id="setup-save-btn" class="primary" ${state.grade&&state.className?'':'disabled'} onclick="finishSetup()">이 학교로 시작하기</button></div>`;
  }
  el.innerHTML=`<div class="setup-container-shell"><div class="setup-shell"><div class="setup-card glass"><div class="setup-top"><div class="setup-kicker">THE SCHOOL ARCHIVE</div><div class="setup-title">처음 한 번만 정하면 돼.</div><div class="setup-copy">교육청 → 학교 → 학급 순서로 하나씩 설정하고, 다음부터는 바로 앱으로 들어갈 수 있어요.</div></div><div class="setup-body"><div class="stepper">${dots}</div>${body}<div class="setup-reset-row"><button class="ghost-link" onclick="clearSchoolProfile();showSetup(1)">처음부터 다시 설정</button></div></div></div></div></div>`;
  if(step===2){
    $('school-input').addEventListener('input',onSchoolInput);
    $('school-input').addEventListener('focus',()=>{if($('school-input').value.trim().length>=2)fetchSchools($('school-input').value.trim())});
  }
  updateSetupButton();
}
function openClassPicker(){
  renderClassPicker();
  $('class-picker-modal').classList.remove('hidden');
  setTimeout(()=>document.querySelector('#grade-picker-list .class-pick-option.active')?.scrollIntoView({block:'center',behavior:'smooth'}),20);
}
function closeClassPicker(){$('class-picker-modal').classList.add('hidden')}
function renderClassPicker(){
  const gradeBox=$('grade-picker-list'),classBox=$('class-picker-list');if(!gradeBox||!classBox)return;
  gradeBox.innerHTML=gradeOptions().map(g=>`<button class="class-pick-option ${String(state.grade)===String(g)?'active':''}" onclick="pickGrade('${g}')"><span>${g}학년</span><b>${String(state.grade)===String(g)?'✓':'›'}</b></button>`).join('');
  const classes=Array.from({length:40},(_,i)=>i+1);
  classBox.innerHTML=classes.map(c=>`<button class="class-pick-option ${String(state.className)===String(c)?'active':''}" onclick="pickClass('${c}')"><span>${c}반</span><b>${String(state.className)===String(c)?'✓':'›'}</b></button>`).join('');
  const done=$('class-picker-done');if(done)done.disabled=!(state.grade&&state.className);
}
function pickGrade(value){state.grade=String(value);saveProfile();renderClassPicker();updateSetupButton()}
function pickClass(value){state.className=String(value);saveProfile();renderClassPicker();updateSetupButton();}
function confirmClassPicker(){if(!(state.grade&&state.className)){showToast('학년과 반을 모두 선택해주세요.');return}saveProfile();closeClassPicker();renderSetup()}

function chooseOffice(code,name){state.officeCode=code;state.officeName=name;state.schoolCode='';state.schoolName='';state.schoolKind='';state.schoolData=null;state.grade='';state.className='';saveProfile();renderSetup();}
function nextSetupStep(){
  if(state.setupStep===1&&!state.officeCode){showToast('교육청을 먼저 선택해주세요.');return}
  if(state.setupStep===2&&!state.schoolCode){showToast('학교를 검색해서 하나 선택해주세요.');return}
  state.setupStep=Math.min(3,state.setupStep+1);renderSetup();
}
function updateSetupButton(){
  const b=$('setup-save-btn');if(b)b.disabled=!(state.grade&&state.className);
  const o=$('office-next');if(o)o.disabled=!state.officeCode;
  const s=$('school-next');if(s)s.disabled=!state.schoolCode;
}
function openOfficePicker(){$('office-modal').classList.remove('hidden')}
function closeOfficePicker(){$('office-modal').classList.add('hidden')}
let searchTimer=null;
function onSchoolInput(e){const q=e.target.value.trim();state.schoolCode='';state.schoolName='';state.schoolKind='';saveProfile();updateSetupButton();$('school-results').classList.add('hidden');clearTimeout(searchTimer);if(q.length<2)return;searchTimer=setTimeout(()=>fetchSchools(q),300)}
async function fetchSchools(query){
  const box=$('school-results');box.classList.remove('hidden');setLoading(box,'학교 목록을 찾는 중...');
  try{const data=await neis('schoolInfo',{ATPT_OFCDC_SC_CODE:state.officeCode,SCHUL_NM:query,pSize:'30'});const rows=extractRows(data,'schoolInfo');if(!rows.length){box.innerHTML='<div class="empty">검색 결과가 없습니다.</div>';return}
    box.innerHTML='';rows.forEach(s=>{const b=document.createElement('button');b.className='school-item';b.innerHTML=`<strong>${esc(s.SCHUL_NM)}</strong><small>${esc(s.ORG_RDNMA||'')} · ${esc(s.SCHUL_KND_SC_NM||'')}</small>`;b.onclick=()=>selectSchool(s);box.appendChild(b)});
  }catch(e){console.error(e);box.innerHTML='<div class="empty">학교 검색에 실패했습니다.</div>'}
}
function selectSchool(s){
  state.schoolCode=s.SD_SCHUL_CODE;state.schoolName=s.SCHUL_NM;state.schoolKind=s.SCHUL_KND_SC_NM||'';state.schoolData=s;state.grade='';state.className='';state.setupStep=3;saveProfile();
  const input=$('school-input');if(input)input.value=s.SCHUL_NM;const box=$('school-results');if(box)box.classList.add('hidden');updateSetupButton();
  renderSetup();
}
function finishSetup(){
  if(!(state.officeCode&&state.schoolCode&&state.grade&&state.className)){showToast('교육청 · 학교 · 학급 정보를 모두 선택해주세요.');return}
  saveProfile();bootDashboard();
}
function changeSchoolInfo(){state.officeCode='';state.officeName='';state.schoolCode='';state.schoolName='';state.schoolKind='';state.schoolData=null;state.grade='';state.className='';clearSchoolProfile();showSetup(1)}

/* ======================== DASHBOARD ======================== */
async function bootDashboard(){
  saveProfile();$('setup-container').classList.add('hidden');$('dashboard-container').classList.remove('hidden');
  $('school-title').textContent=state.schoolName;$('school-detail').textContent=`${state.officeName} · ${state.schoolKind||'학교'} · ${state.grade}학년 ${state.className}반`;
  state.currentTab='meal';state.currentView='direct';state.aiChatHistory=[];state.aiLastReport='';state.aiLastError='';state.selectedMealDate=todayDate();state.selectedTimetableDate=todayDate();state.scheduleMonth=new Date(todayDate().getFullYear(),todayDate().getMonth(),1);
  showDirectView(false);setViewModeButton('direct');switchTab('meal');
  const tasks=[];
  tasks.push(fetchMealWindow().then(()=>renderMealTab()).catch(e=>{console.error(e);renderMealTab()}));
  tasks.push(fetchScheduleYear().catch(e=>console.error(e)));
  tasks.push(loadTimetableForDate(state.selectedTimetableDate).catch(e=>console.error(e)));
  await Promise.allSettled(tasks);
  renderMealTab();renderTimetableTab();renderScheduleTab();
}
function setViewModeButton(mode){
  const b=$('view-mode-button');if(!b)return;
  if(mode==='ai'){
    b.classList.add('direct-mode');
    b.innerHTML=`<span class="view-mode-icon">⌘</span><span class="view-mode-copy"><strong>정보 직접 보기</strong><small>급식 · 하루 시간표 · 학사일정을 직접 확인하세요.</small></span><span class="view-mode-arrow">›</span>`;
    b.setAttribute('aria-label','정보 직접 보기');
  }else{
    b.classList.remove('direct-mode');
    b.innerHTML=`<span class="view-mode-icon">✦</span><span class="view-mode-copy"><strong>정보가 복잡하다면? 대마법사에게 물어보기</strong><small>급식 · 하루 시간표 · 학사일정을 한 번에 물어볼 수 있어요.</small></span><span class="view-mode-arrow">›</span>`;
    b.setAttribute('aria-label','대마법사에게 물어보기');
  }
}
function toggleViewMode(){if(state.currentView==='ai')showDirectView();else showAiView()}
function showAiView(){
  if($('dashboard-container').classList.contains('hidden'))return;
  state.currentView='ai';$('dashboard-container').classList.add('dashboard-ai-mode');$('direct-view').classList.add('hidden');$('ai-view').classList.remove('hidden');setViewModeButton('ai');
  loadAiLanding();setTimeout(scrollAiToBottom,30);
}
function showDirectView(scrollTop=true){
  state.currentView='direct';$('dashboard-container').classList.remove('dashboard-ai-mode');$('direct-view').classList.remove('hidden');$('ai-view').classList.add('hidden');setViewModeButton('direct');if(scrollTop)$('main-scroll')?.scrollTo({top:0,behavior:'smooth'});
}
function switchTab(tab){
  state.currentTab=tab;showDirectView(false);['meal','timetable','schedule'].forEach(t=>{$(`tab-${t}`).classList.toggle('active',t===tab);$(`tab-btn-${t}`).classList.toggle('active',t===tab)});$('main-scroll')?.scrollTo({top:0,behavior:'smooth'});renderCurrentTab();
}
function renderCurrentTab(){if(state.currentTab==='meal')renderMealTab();if(state.currentTab==='timetable')renderTimetableTab();if(state.currentTab==='schedule')renderScheduleTab()}
function reloadCurrentTab(){
  if($('dashboard-container').classList.contains('hidden'))return;
  if(state.currentView==='ai'){loadAiLanding();return}
  if(state.currentTab==='meal')fetchMealWindow().then(renderMealTab).catch(()=>showToast('급식 정보를 새로 불러오지 못했습니다.'));
  if(state.currentTab==='schedule')fetchScheduleYear().then(renderScheduleTab).catch(()=>showToast('학사일정을 새로 불러오지 못했습니다.'));
  if(state.currentTab==='timetable')loadTimetableForDate(state.selectedTimetableDate).then(renderTimetableTab).catch(()=>showToast('시간표를 새로 불러오지 못했습니다.'));
}
async function goToday(){
  if($('dashboard-container').classList.contains('hidden'))return;const d=todayDate();state.selectedMealDate=d;state.selectedTimetableDate=d;state.scheduleMonth=new Date(d.getFullYear(),d.getMonth(),1);
  if(state.currentView==='ai'){loadAiLanding();return}renderCurrentTab();if(state.currentTab==='timetable'){try{await loadTimetableForDate(d);renderTimetableTab()}catch(e){console.error(e)}}
}
/* ======================== MEAL ======================== */
function mealWindowEnd(){const d=todayDate();d.setDate(d.getDate()+6);return d}
function isMealWindowDate(d){const t=todayDate(),end=mealWindowEnd();return d>=t&&d<=end}
async function fetchMealWindow(){
  const t=todayDate(),end=mealWindowEnd();
  const data=await neis('mealServiceDietInfo',{ATPT_OFCDC_SC_CODE:state.officeCode,SD_SCHUL_CODE:state.schoolCode,MLSV_FROM_YMD:ymd(t),MLSV_TO_YMD:ymd(end),pSize:'100'});
  state.mealRows=extractRows(data,'mealServiceDietInfo').filter(r=>r.MMEAL_SC_CODE==='2');state.mealLoaded=true;
}
function mealFor(date){if(!isMealWindowDate(date))return null;return state.mealRows.find(r=>r.MLSV_YMD===ymd(date)&&r.MMEAL_SC_CODE==='2')}
function selectMealDate(date){
  const d=new Date(date);d.setHours(0,0,0,0);
  if(!isMealWindowDate(d)){showToast('급식은 오늘부터 7일만 확인할 수 있어요.');return}
  state.selectedMealDate=d;renderMealTab();$('main-scroll').scrollTo({top:0,behavior:'smooth'});
}
function renderMealTab(){
  const el=$('tab-meal');if(!el)return;let d=state.selectedMealDate||todayDate();if(!isMealWindowDate(d))d=todayDate();state.selectedMealDate=d;const meal=mealFor(d);const menus=meal?htmlMenu(meal.DDISH_NM):[];
  state.todayMenuText=menus.join(', ');state.todayCalInfo=meal?.CAL_INFO||'';
  const t=todayDate(),end=mealWindowEnd();
  el.innerHTML=`
    <div class="section-head"><div><div class="section-title">급식</div><div class="section-sub">오늘 포함 앞으로 7일의 중식만 보여줍니다.</div></div><div class="section-actions"><button class="small-btn today-inline ${isSameDay(d,t)?'active':''}" onclick="selectMealDate(todayDate())">오늘</button></div></div>
    <div class="meal-layout">
      <article class="meal-hero">
        <div class="date-row"><div><div class="date-big">${fmtLong(d)}</div><div class="date-small">${weekday(d)}요일 · 중식</div></div><div class="today-tag">${isSameDay(d,t)?'TODAY':`${shortDate(d)}`}</div></div>
        <div class="menu-heading">LUNCH MENU</div>
        <div class="menu-list">${menus.length?menus.map(m=>`<span class="menu-chip">${esc(m)}</span>`).join(''):'<span class="meal-empty-copy">등록된 중식 급식 정보가 없습니다.</span>'}</div>
        <div class="meal-foot"><div class="meal-note">${isSameDay(d,t)?'오늘의 급식을 보고 있어요.':'선택한 날짜의 급식을 보고 있어요.'}<br>원하는 날짜를 아래에서 눌러보세요.</div><div class="calorie"><div class="calorie-label">중식 기준 열량</div><div class="calorie-value">${esc(meal?.CAL_INFO||'정보 없음')}</div></div></div>
      </article>
      <aside class="meal-ai">
        <div><div class="ai-label">WIZARD'S NOTE</div><div class="ai-title">오늘의 한 줄 예언</div><div id="meal-ai-copy" class="ai-copy">대마법사가 오늘의 식단을 읽는 중이니라...</div></div>
        <div class="ai-footer"><span class="ai-footer-note">복잡하다면 상단의 대마법사에게 물어보세요.</span><button class="ai-button" onclick="showAiView()">대화 시작 →</button></div>
      </aside>
    </div>
    <div class="week-section">
      <div class="section-head"><div><div class="section-title">앞으로 7일</div><div class="section-sub">${shortDate(t)} — ${shortDate(end)} · 원하는 날짜를 누르세요.</div></div></div>
      <div class="week-shell"><div id="meal-week" class="week-scroller"></div></div>
    </div>`;
  renderMealWeek();
  loadMealProphecy(d,meal);
}
function renderMealWeek(){
  const box=$('meal-week');if(!box)return;box.innerHTML='';const t=todayDate();
  for(let i=0;i<7;i++){
    const d=new Date(t);d.setDate(t.getDate()+i);const meal=mealFor(d);const menus=meal?htmlMenu(meal.DDISH_NM):[];const b=document.createElement('button');b.className=`week-day ${isSameDay(d,state.selectedMealDate)?'active':''}`;
    b.innerHTML=`<div class="day-top"><span class="day-name">${isSameDay(d,t)?'TODAY':weekday(d)+'요일'}</span><span class="day-num">${d.getDate()}</span></div><div class="day-meal">${menus.length?esc(menus.slice(0,3).join(' · '))+(menus.length>3?' …':''):'급식 없음'}</div><div class="day-cal">${meal?esc(meal.CAL_INFO||'열량 미기재'):'—'}</div>`;
    b.onclick=()=>selectMealDate(d);box.appendChild(b);
  }
}
function scrollWeek(offset){$('meal-week')?.scrollBy({left:offset,behavior:'smooth'})}

/* ======================== TIMETABLE ======================== */
function getTimetableEndpoint(){const k=state.schoolKind||'';if(k.includes('초등'))return 'elsTimetable';if(k.includes('중학'))return 'misTimetable';if(k.includes('고등'))return 'hisTimetable';return ''}
async function loadTimetableForDate(date){
  const endpoint=getTimetableEndpoint();if(!endpoint)return;
  const key=`${endpoint}|${ymd(date)}|${state.grade}`;if(state.timetableCache[key])return state.timetableCache[key];
  const data=await neis(endpoint,{ATPT_OFCDC_SC_CODE:state.officeCode,SD_SCHUL_CODE:state.schoolCode,ALL_TI_YMD:ymd(date),GRADE:state.grade,pSize:'1000'});
  const rows=extractRows(data,endpoint).filter(r=>!r.GRADE||String(r.GRADE)===String(state.grade));
  state.timetableCache[key]=rows;return rows;
}
function getSelectedTimetableRows(){const endpoint=getTimetableEndpoint();return state.timetableCache[`${endpoint}|${ymd(state.selectedTimetableDate)}|${state.grade}`]||[]}
async function selectTimetableDate(date){state.selectedTimetableDate=new Date(date);renderTimetableTab();try{await loadTimetableForDate(state.selectedTimetableDate);renderTimetableTab()}catch(e){console.error(e);showToast('시간표를 불러오지 못했습니다.')}}
function renderTimetableTab(){
  const el=$('tab-timetable');if(!el)return;const d=state.selectedTimetableDate||todayDate();const endpoint=getTimetableEndpoint();const rows=getSelectedTimetableRows();
  const days=[];for(let i=-2;i<5;i++){const x=new Date(todayDate());x.setDate(x.getDate()+i);days.push(x)}
  const weekHtml=days.map(x=>`<button class="day-pill ${isSameDay(x,d)?'active':''}" onclick="selectTimetableDate(new Date('${x.toISOString().slice(0,10)}'))"><div class="w">${weekday(x)}요일</div><div class="d">${x.getDate()}</div></button>`).join('');
  el.innerHTML=`
    <div class="section-head"><div><div class="section-title">하루 시간표</div><div class="section-sub">저장된 ${state.grade}학년 ${state.className}반 기준입니다.</div></div><div class="section-actions"><button class="small-btn" onclick="state.selectedTimetableDate=todayDate();loadTimetableForDate(state.selectedTimetableDate).then(renderTimetableTab)">오늘</button></div></div>
    <div class="timetable-toolbar"><div class="day-picker">${weekHtml}</div><div class="filter-pair"><select class="select-pill" onchange="changeSavedGrade(this.value)">${gradeOptions().map(g=>`<option value="${g}" ${String(g)===String(state.grade)?'selected':''}>${g}학년</option>`).join('')}</select><select class="select-pill" onchange="changeSavedClass(this.value)">${Array.from({length:40},(_,i)=>i+1).map(c=>`<option value="${c}" ${String(c)===String(state.className)?'selected':''}>${c}반</option>`).join('')}</select></div></div>
    <article class="glass timetable-card">
      <div class="timetable-meta"><div><div class="timetable-date">${fmtLong(d)}</div><div class="timetable-sub">${weekday(d)}요일 · ${state.schoolName} · ${state.grade}학년 ${state.className}반</div></div><div class="today-tag">${isSameDay(d,todayDate())?'TODAY':'DAY VIEW'}</div></div>
      ${endpoint?renderSelectedDayTable(rows):'<div class="empty">학교급을 판별할 수 없어 시간표를 준비하지 못했습니다.</div>'}
    </article>`;
}
function renderSelectedDayTable(rows){
  if(!rows.length)return '<div class="empty">선택한 날에는 등록된 시간표가 없습니다.</div>';
  const cls=String(state.className);let filtered=rows.filter(r=>!r.CLASS_NM||normClass(r.CLASS_NM)===normClass(cls));
  if(!filtered.length){filtered=rows.filter(r=>String(r.CLASS_NM||'').includes(cls));}
  if(!filtered.length)return '<div class="empty">선택한 반의 시간표가 없습니다.<br>저장된 반 정보를 확인해보세요.</div>';
  filtered.sort((a,b)=>(Number(a.PERIO)||0)-(Number(b.PERIO)||0));
  return `<table class="single-day-table"><tbody>${filtered.map(r=>`<tr><td>${Number(r.PERIO)||''}교시</td><td><div class="single-subject">${esc(r.ITRT_CNTNT||r.SUBJECT||r.ITRT_NM||'수업')}</div><div class="single-room">${esc(r.CLRM_NM||'')}</div></td></tr>`).join('')}</tbody></table>`;
}
async function changeSavedGrade(v){state.grade=v;state.timetableCache={};saveProfile();$('school-detail').textContent=`${state.officeName} · ${state.schoolKind||'학교'} · ${state.grade}학년 ${state.className}반`;await loadTimetableForDate(state.selectedTimetableDate);renderTimetableTab()}
async function changeSavedClass(v){state.className=v;saveProfile();$('school-detail').textContent=`${state.officeName} · ${state.schoolKind||'학교'} · ${state.grade}학년 ${state.className}반`;renderTimetableTab()}

/* ======================== SCHEDULE ======================== */
function currentScheduleYear(){return todayDate().getFullYear()}
function scheduleRowsForMonth(monthDate){return state.scheduleRows.filter(r=>{const d=fromYmd(r.AA_YMD);return d.getFullYear()===currentScheduleYear()&&d.getMonth()===monthDate.getMonth()}).sort((a,b)=>String(a.AA_YMD).localeCompare(String(b.AA_YMD)))}
async function fetchScheduleYear(){
  const year=currentScheduleYear();const targetMonth=state.scheduleMonth?state.scheduleMonth.getMonth():todayDate().getMonth();state.scheduleMonth=new Date(year,targetMonth,1);
  if(state.scheduleMonth.getFullYear()!==year)state.scheduleMonth=new Date(year,todayDate().getMonth(),1);
  const data=await neis('SchoolSchedule',{ATPT_OFCDC_SC_CODE:state.officeCode,SD_SCHUL_CODE:state.schoolCode,AA_FROM_YMD:`${year}0101`,AA_TO_YMD:`${year}1231`,pSize:'1000'});
  state.scheduleRows=extractRows(data,'SchoolSchedule').filter(r=>String(r.AA_YMD||'').startsWith(String(year))).sort((a,b)=>String(a.AA_YMD).localeCompare(String(b.AA_YMD)));renderScheduleTab();
}
function moveScheduleMonth(delta){
  const year=currentScheduleYear(),cur=state.scheduleMonth||new Date(year,todayDate().getMonth(),1);const next=new Date(year,cur.getMonth()+delta,1);
  if(next.getFullYear()!==year){showToast(`${year}년 학사일정만 확인할 수 있어요.`);return}
  state.scheduleMonth=next;renderScheduleTab();
}
function renderScheduleTab(){
  const el=$('tab-schedule');if(!el)return;const year=currentScheduleYear(),month=state.scheduleMonth?.getFullYear()===year?state.scheduleMonth:new Date(year,todayDate().getMonth(),1),today=ymd(todayDate()),rows=scheduleRowsForMonth(month),visible=rows.slice(0,6);state.scheduleMonth=month;
  const atStart=month.getMonth()===0,atEnd=month.getMonth()===11;
  el.innerHTML=`
    <div class="section-head"><div><div class="section-title">학사일정</div><div class="section-sub">${year}년 일정만 확인할 수 있습니다.</div></div><div class="section-actions"><button class="small-btn" onclick="state.scheduleMonth=new Date(${year},${todayDate().getMonth()},1);renderScheduleTab()">이번 달</button><button class="small-btn" onclick="openScheduleModal()">전체 보기</button></div></div>
    <article class="glass schedule-card">
      <div class="schedule-toolbar"><div class="month-chip"><button class="icon-btn" ${atStart?'disabled':''} onclick="moveScheduleMonth(-1)">←</button><div id="schedule-month-label" class="month-label">${fmtMonth(month)}</div><button class="icon-btn" ${atEnd?'disabled':''} onclick="moveScheduleMonth(1)">→</button></div><div style="font-size:9px;color:#98a2b2">${rows.length}개 일정</div></div>
      <div class="schedule-list">${visible.length?visible.map(r=>{const d=fromYmd(r.AA_YMD);return `<div class="event"><div class="event-date ${r.AA_YMD===today?'today-event':''}">${d.getMonth()+1}/${d.getDate()}<br>${weekday(d)}</div><div><div class="event-title">${esc(r.EVENT_NM||'일정')}</div>${r.EVENT_CNTNT?`<div class="event-desc">${esc(cleanHtmlText(r.EVENT_CNTNT))}</div>`:''}</div></div>`}).join(''):'<div class="schedule-empty">등록된 학사일정이 없습니다.</div>'}</div>
      <button class="schedule-more" onclick="openScheduleModal()">${rows.length>visible.length?'이 달의 일정 전체 보기':'학사일정 자세히 보기'}</button>
    </article>`;
}
function openScheduleModal(){
  const rows=scheduleRowsForMonth(state.scheduleMonth);$('schedule-modal-sub').textContent=`${fmtMonth(state.scheduleMonth)} · ${rows.length}개 일정`;
  const content=$('schedule-modal-content');content.innerHTML=rows.length?rows.map(r=>{const d=fromYmd(r.AA_YMD);return `<div class="event" style="margin-bottom:8px"><div class="event-date ${r.AA_YMD===ymd(todayDate())?'today-event':''}">${d.getMonth()+1}/${d.getDate()}<br>${weekday(d)}</div><div><div class="event-title">${esc(r.EVENT_NM||'일정')}</div>${r.EVENT_CNTNT?`<div class="event-desc" style="white-space:normal;line-height:1.5">${esc(cleanHtmlText(r.EVENT_CNTNT))}</div>`:''}</div></div>`}).join(''):'<div class="schedule-empty">등록된 학사일정이 없습니다.</div>';
  $('schedule-modal').classList.remove('hidden');
}
function closeScheduleModal(){$('schedule-modal').classList.add('hidden')}

/* ======================== AI ======================== */
const GEMINI_MODELS=['gemini-3.1-flash-lite','gemini-3.5-flash-lite'];
async function callGemini(systemPrompt,userPrompt,history=[],options={}){
  let keys;try{keys=await getApiKeys()}catch(e){state.aiLastError='API 키 복호화에 실패했습니다.';console.error(e);return null}
  if(!keys?.gemini){state.aiLastError='Gemini API 키를 찾지 못했습니다.';return null}
  const models=options.models||GEMINI_MODELS;
  const maxOutputTokens=options.maxOutputTokens||320;
  const timeoutMs=options.timeoutMs||9000;
  const contents=[...history.slice(-4).map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:String(m.text||'')}]})),{role:'user',parts:[{text:userPrompt}]}];
  let lastError='';
  for(const model of models){
    const url=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
    const payload={contents,systemInstruction:{parts:[{text:systemPrompt}]},generationConfig:{maxOutputTokens,thinkingConfig:{thinkingLevel:'minimal'}}};
    const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),timeoutMs);
    try{
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':keys.gemini},body:JSON.stringify(payload),signal:controller.signal});
      const data=await r.json().catch(()=>({}));
      if(r.ok){const txt=data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('').trim();if(txt){state.aiLastError='';clearTimeout(timer);return txt}}
      const apiMessage=data?.error?.message||data?.error?.status||`HTTP ${r.status}`;lastError=`${model}: ${apiMessage}`;console.warn('Gemini error',model,r.status,data);if(r.status===401||r.status===403)break;
    }catch(e){lastError=`${model}: ${e?.name==='AbortError'?'응답 시간 초과':(e?.message||'네트워크 오류')}`;console.warn('Gemini fetch error',e)}finally{clearTimeout(timer)}
  }
  state.aiLastError=lastError||'알 수 없는 Gemini 오류';return null;
}

/* ======================== MEAL AI QUICK INSIGHT ======================== */
async function loadMealProphecy(date,meal){
  const box=$('meal-ai-copy');if(!box)return;
  const menus=meal?htmlMenu(meal.DDISH_NM):[];
  if(!meal||!menus.length){box.textContent='오늘은 등록된 중식 정보가 없어 예언을 내릴 수 없노라.';return}
  const key=`${ymd(date)}|${menus.join('|')}|${meal.CAL_INFO||''}`;
  if(state.aiQuickInsightCache[key]){box.textContent=state.aiQuickInsightCache[key];return}
  if(state.aiQuickInsightKey===key && state.aiQuickInsightPending)return;
  state.aiQuickInsightKey=key;
  box.textContent='대마법사가 오늘의 식단을 살펴보는 중이니라...';
  const system='너는 학교 생활을 돕는 판타지 세계의 대마법사다. 오늘 급식 메뉴만 보고 학생이 재미있게 읽을 짧은 한 줄 예언을 만든다. 사실을 과장하거나 영양학적 의학 조언을 하지 말고, 35~55자 정도의 자연스러운 한국어 한 문장으로 답한다. 마법사 말투는 살짝만 사용한다.';
  const prompt=`오늘의 급식 메뉴: ${menus.join(', ')}\n열량: ${meal.CAL_INFO||'정보 없음'}\n한 줄 예언만 작성해줘.`;
  const pending=callGemini(system,prompt,[],{models:['gemini-3.1-flash-lite'],maxOutputTokens:90,timeoutMs:6500});
  state.aiQuickInsightPending=pending;
  const reply=await pending;state.aiQuickInsightPending=null;
  if(state.aiQuickInsightKey!==key)return;
  if(reply){state.aiQuickInsightCache[key]=reply;box.textContent=reply}
  else{
    const fallback=`오늘의 식단에는 든든한 기운이 감도는구나. 한 끼를 천천히 즐기도록 하거라.`;
    state.aiQuickInsightCache[key]=fallback;box.textContent=fallback;
  }
}
function buildContext(){
  const meal=mealFor(state.selectedMealDate);const mealText=meal?htmlMenu(meal.DDISH_NM).join(', '):'등록된 중식 없음';
  const tt=getSelectedTimetableRows().filter(r=>!r.CLASS_NM||normClass(r.CLASS_NM)===normClass(state.className)).sort((a,b)=>(Number(a.PERIO)||0)-(Number(b.PERIO)||0));
  const timetableText=tt.length?tt.map(r=>`${r.PERIO}교시 ${r.ITRT_CNTNT||r.SUBJECT||r.ITRT_NM||'수업'}${r.CLRM_NM?`(${r.CLRM_NM})`:''}`).join(', '):'등록된 시간표 없음';
  const scheduleText=state.scheduleRows.filter(r=>String(r.AA_YMD||'').startsWith(String(currentScheduleYear()))).sort((a,b)=>String(a.AA_YMD).localeCompare(String(b.AA_YMD))).slice(0,24).map(r=>`${r.AA_YMD}: ${r.EVENT_NM||'일정'}${r.EVENT_CNTNT?` - ${cleanHtmlText(r.EVENT_CNTNT)}`:''}`).join('\n')||'학사일정 없음';
  return `학교: ${state.schoolName}\n학급: ${state.grade}학년 ${state.className}반\n기준 급식 날짜: ${ymd(state.selectedMealDate)}\n급식: ${mealText}\n열량: ${meal?.CAL_INFO||'정보 없음'}\n기준 시간표 날짜: ${ymd(state.selectedTimetableDate)}\n시간표: ${timetableText}\n${currentScheduleYear()}년 학사일정:\n${scheduleText}`;
}
function appendAiMessage(role,text){const log=$('ai-chat-log');if(!log)return;const div=document.createElement('div');div.className=`ai-message ${role}`;div.textContent=text;log.appendChild(div);return div}
function scrollAiToBottom(){const el=$('ai-chat-scroll');if(el)el.scrollTo({top:el.scrollHeight,behavior:'smooth'})}
function appendAiError(detail){const log=$('ai-chat-log');if(!log)return;const div=document.createElement('div');div.className='ai-error-card';div.innerHTML=`<strong>수정구슬의 연결이 잠시 막혔어요.</strong><div>연결 상태를 확인한 뒤 다시 시도해보세요.</div><div class="ai-error-detail">${esc(detail||'알 수 없는 오류')}</div>`;log.appendChild(div)}
async function loadAiLanding(){
  const log=$('ai-chat-log');if(!log)return;
  if(log.dataset.welcomed==='1')return;
  log.dataset.welcomed='1';state.aiBusy=false;state.aiChatHistory=[];state.aiLastError='';
  log.innerHTML=`<div class="ai-welcome-card"><div class="ai-welcome-top"><div class="ai-welcome-mark">✦</div><div><div class="ai-welcome-title">대마법사가 기록실을 열었습니다.</div><div class="ai-welcome-copy">급식 · 하루 시간표 · 학사일정을 모두 살펴보고 질문에 답할 준비가 되었노라.</div></div></div><div class="ai-suggestion-row"><button class="ai-suggestion" onclick="useAiSuggestion('오늘 중요한 것만 알려줘.')">오늘 중요한 것</button><button class="ai-suggestion" onclick="useAiSuggestion('이번 주 학사일정만 정리해줘.')">이번 주 일정</button><button class="ai-suggestion" onclick="useAiSuggestion('오늘 시간표를 순서대로 알려줘.')">오늘 시간표</button></div></div>`;
  scrollAiToBottom();
}

function useAiSuggestion(q){const input=$('ai-chat-input');if(input){input.value=q;sendAiChat()}}
async function sendAiChat(){
  const input=$('ai-chat-input');const q=input?.value.trim();if(!q||state.aiBusy)return;if(state.currentView!=='ai')showAiView(false);state.aiBusy=true;input.value='';appendAiMessage('user',q);const thinking=appendAiMessage('model','대마법사가 기록실을 다시 살피는 중이니라...');scrollAiToBottom();
  const system='너는 학교 생활을 도와주는 판타지 세계의 대마법사다. 아래 컨텍스트의 급식, 시간표, 학사일정 세 가지 데이터만 근거로 질문에 답하라. 없는 사실은 만들지 말고 모르면 모른다고 하라. 질문이 오늘 날짜와 관련되면 현재 선택된 날짜를 기준으로 답하라. 마법사 말투는 조금만 사용하고 정보 전달을 우선하라.';
  const history=state.aiChatHistory.slice(-8);const answer=await callGemini(system,`${buildContext()}\n\n학생의 질문: ${q}`,history,{maxOutputTokens:260,timeoutMs:9000});state.aiBusy=false;
  if(answer){thinking.remove();appendAiMessage('model',answer);state.aiChatHistory.push({role:'user',text:q},{role:'assistant',text:answer})}else{thinking.remove();appendAiError(state.aiLastError)}scrollAiToBottom();
}
